name: DialogsPlus
version: '2.1'
main: com.motol.dialogsplus.DialogsPlus
api-version: '26.3'
author: motol
folia-supported: true

commands:
  dialogs:
    description: Opens the Dialogs+ menu
  dialogsplus:
    description: Dialogs+ admin command

permissions:
  dialogsplus.open.others:
    description: Open a menu for another player with /dialogs <menu-id> <player>
    default: op